name: Android debug APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle offline NSFW classifier (MIT, pinned upstream)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            "https://media.githubusercontent.com/media/getknit/knit/d3b8210629316247198371cc8deba46af13ce4af/app/src/main/assets/moderation/nsfw.tflite" \
            -o android/app/src/main/assets/nsfw.tflite
          python3 - <<'PY'
          from pathlib import Path
          data = Path("android/app/src/main/assets/nsfw.tflite").read_bytes()
          assert len(data) > 16_000_000 and data[4:8] == b"TFL3", "Model must be a TFLite FlatBuffer, not a Git LFS pointer"
          print(f"Bundled offline NSFW model: {len(data)} bytes")
          PY
      - name: Assemble Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EncryptedPhotoVault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
