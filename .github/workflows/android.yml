name: Android debug APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle offline NSFW classifier (MIT, pinned upstream)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          python3 - <<'PY'
          import pathlib, subprocess, urllib.request, zipfile, shutil, os
          dst = pathlib.Path("android/app/src/main/assets/nsfw.tflite")
          srcs = [
              "https://media.githubusercontent.com/media/getknit/knit/main/app/src/main/assets/moderation/nsfw.tflite",
              "https://github.com/getknit/knit/raw/refs/heads/main/app/src/main/assets/moderation/nsfw.tflite",
          ]
          for url in srcs:
              try:
                  subprocess.run(["curl", "-fLsS", "--retry", "2", "--max-time", "120",
                                  "-o", str(dst), url], check=True)
                  data = dst.read_bytes()
                  if len(data) > 16_000_000 and data[4:8] == b"TFL3":
                      print(f"Bundled offline NSFW model ({len(data)} bytes)")
                      break
              except Exception as e:
                  print(f"Mirror unavailable: {type(e).__name__}")
          else:
              # Official model release is the fallback if a Git LFS mirror is unavailable.
              archive = pathlib.Path("/tmp/nsfw_mobilenet_v2_140_224.zip")
              subprocess.run(["curl", "-fLsS", "--retry", "3", "--max-time", "240",
                  "-o", str(archive),
                  "https://github.com/GantMan/nsfw_model/releases/download/1.1.0/nsfw_mobilenet_v2_140_224.zip"], check=True)
              with zipfile.ZipFile(archive) as z:
                  models = [n for n in z.namelist() if n.lower().endswith(".tflite")]
                  assert models, "Official release does not contain a TFLite model"
                  with z.open(models[0]) as inp, dst.open("wb") as out:
                      shutil.copyfileobj(inp, out)
              data = dst.read_bytes()
              assert len(data) > 10_000_000 and data[4:8] == b"TFL3", "Invalid TFLite payload"
              print(f"Bundled release NSFW model ({len(data)} bytes)")
          # Pin the exact model that was verified in the previous successful APK.
          import hashlib
          expected_sha256 = "380f98f7685f9d8a386f8cc595b6dfcb972989aae3d1b8b270d3a4a5b96fab40"
          actual = hashlib.sha256(data).hexdigest()
          assert actual == expected_sha256, f"Model SHA256 mismatch: {actual}"
          shutil.copyfile("MODEL_LICENSE.md", "android/app/src/main/assets/MODEL_LICENSE.md")
          print(f"Verified bundled model SHA-256: {actual}")
          PY
      - name: Assemble Android debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EncryptedPhotoVault-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
